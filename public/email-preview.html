<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaynahs Dispatcher — Email Templates Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 20px; }
    .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: #ffffff; border-color: #3b82f6; }
    .preview-card { max-width: 600px; margin: 0 auto; background: #111827; border-radius: 16px; border: 1px solid #1f2937; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .view-frame { width: 100%; border: none; min-height: 680px; }
  </style>
</head>
<body>

  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTemplate('confirm')">1. Email Confirmation</button>
    <button class="tab-btn" onclick="switchTemplate('reset')">2. Password Reset</button>
    <button class="tab-btn" onclick="switchTemplate('magic')">3. Magic Link</button>
    <button class="tab-btn" onclick="switchTemplate('invite')">4. Team Invite</button>

  <div class="preview-card">
    <iframe id="previewFrame" class="view-frame" srcdoc=""></iframe>
  </div>

            <div style="background: linear-gradient(90deg, #8b5cf6, #ec4899); height: 4px;"></div>
            <div style="padding: 24px; text-align: center; border-bottom: 1px solid #1f2937;">
              <img src="${LOGO}" width="56" height="56" style="border-radius: 14px; display: block; margin: 0 auto;" />
              <h1 style="font-size: 18px; margin: 12px 0 2px 0;">Zaynahs Courier Dispatcher</h1>
              <p style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #c084fc; margin: 0; font-weight: 600;">Team Collaboration</p>
            </div>
            <div style="padding: 24px;">
              <span style="background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.3); color: #c084fc; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; letter-spacing: 1px;">TEAM INVITATION</span>
              <h2 style="font-size: 22px; margin: 14px 0 8px 0; color: #fff;">You've Been Invited to Join</h2>
              <p style="color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 16px 0;">You have been invited to collaborate on Zaynahs Courier Dispatcher.</p>
              <div style="text-align: center; margin: 24px 0;">
                <a href="#" style="background: #8b5cf6; color: #fff; padding: 14px 32px; border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-block;">Accept Invitation &rarr;</a>
              </div>
            </div>
            <div style="background: #0d131f; border-top: 1px solid #1f2937; padding: 16px 24px; text-align: center; font-size: 11px; color: #64748b;">
              &copy; 2026 Zaynahs Courier Dispatcher &bull; dispatcher.zaynahspos.com
            </div>
          </div>
        </div>
      `
    };

    function switchTemplate(key) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('previewFrame').srcdoc = templates[key];
    }

    // Set initial
    document.getElementById('previewFrame').srcdoc = templates.confirm;
  </script>
</body>
</html>
